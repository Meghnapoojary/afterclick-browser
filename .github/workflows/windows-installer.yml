name: Build Windows installer

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Package AFTERCLICK for Windows x64
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build renderer and create NSIS installer
        run: npm run dist:win

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AFTERCLICK-Windows-Installer
          path: release/AFTERCLICK-Setup-*.exe
          if-no-files-found: error
          retention-days: 21

  publish-release:
    name: Publish tagged installer release
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: AFTERCLICK-Windows-Installer
          path: release

      - name: Attach installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/AFTERCLICK-Setup-*.exe
